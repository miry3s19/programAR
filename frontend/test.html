<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Debugger AR C - Teste Completo (OCR + API)</title>
    <!-- Importa a biblioteca do Tesseract.js direto da CDN -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; max-width: 800px; }
        textarea { width: 100%; height: 120px; font-family: monospace; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 5px; max-height: 250px; overflow-y: auto; }
        button { padding: 10px 15px; font-size: 15px; cursor: pointer; margin-right: 10px; }
        .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>Debugger C em RA - OCR + Backend Test</h2>

    <!-- PASSO 1: RECONHECIMENTO DA IMAGEM -->
    <div class="box">
        <h3>1. Carregar Foto do Código C (OCR)</h3>
        <input type="file" id="imageInput" accept="image/*"><br><br>
        <button onclick="reconhecerTexto()">1. Extrair Texto da Imagem</button>
        <span id="statusOcr"></span>
    </div>

    <!-- PASSO 2: CÓDIGO EXTRAÍDO (EDITÁVEL) -->
    <div class="box">
        <h3>2. Código C Identificado (Ajuste se o OCR errar algo)</h3>
        <textarea id="codeC">int main() {
    int a = 42;
    int *p = &a;
    *p = 99;
    return 0;
}</textarea>
        <br><br>
        <button onclick="enviarCodigo()">2. Enviar Código para a API</button>
    </div>

    <!-- PASSO 3: RESPOSTA DA MEMÓRIA DA API -->
    <div class="box">
        <h3>3. Resposta de Memória (JSON do Trace)</h3>
        <pre id="resultado">Aguardando disparo...</pre>
    </div>

    <script>
async function reconhecerTexto() {
    const fileInput = document.getElementById('imageInput');
    const status = document.getElementById('statusOcr');
    const codeArea = document.getElementById('codeC');

    if (fileInput.files.length === 0) {
        alert('Por favor, selecione um arquivo de imagem!');
        return;
    }

    const imageFile = fileInput.files[0];
    status.innerText = "⏳ Enviando imagem para o EasyOCR no Python...";

    // Prepara a imagem em formato multipart/form-data
    const formData = new FormData();
    formData.append("file", imageFile);

    try {
        const resposta = await fetch("http://127.0.0.1:8000/ocr", {
            method: "POST",
            body: formData
        });

        const dados = await resposta.json();

        if (dados.success) {
            codeArea.value = dados.code;
            status.innerText = "✅ OCR via EasyOCR concluído com sucesso!";
        } else {
            status.innerText = "❌ Falha no processamento da imagem.";
        }
    } catch (err) {
        status.innerText = "❌ Erro ao conectar com o EasyOCR: " + err;
    }
}
        // Função que envia o texto para a nossa API FastAPI
        async function enviarCodigo() {
            const codigo = document.getElementById("codeC").value;
            const campoResultado = document.getElementById("resultado");

            campoResultado.innerText = "⏳ Processando execução em C na API...";

            try {
                const resposta = await fetch("http://127.0.0.1:8000/trace", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ code: codigo })
                });

                const dados = await resposta.json();
                campoResultado.innerText = JSON.stringify(dados, null, 2);
            } catch (erro) {
                campoResultado.innerText = "❌ Erro na API: " + erro;
            }
        }
    </script>
</body>
</html>
